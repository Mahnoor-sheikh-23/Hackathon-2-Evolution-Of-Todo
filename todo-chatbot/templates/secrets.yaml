apiVersion: v1
kind: Secret
metadata:
  name: todo-app-secrets
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.backend.env.DATABASE_URL }}
  DATABASE_URL: {{ .Values.backend.env.DATABASE_URL | b64enc | quote }}
  {{- end }}
  {{- if .Values.backend.env.BETTER_AUTH_SECRET }}
  BETTER_AUTH_SECRET: {{ .Values.backend.env.BETTER_AUTH_SECRET | b64enc | quote }}
  {{- end }}
  {{- if .Values.database.env.POSTGRES_DB }}
  POSTGRES_DB: {{ .Values.database.env.POSTGRES_DB | b64enc | quote }}
  {{- end }}
  {{- if .Values.database.env.POSTGRES_USER }}
  POSTGRES_USER: {{ .Values.database.env.POSTGRES_USER | b64enc | quote }}
  {{- end }}
  {{- if .Values.database.env.POSTGRES_PASSWORD }}
  POSTGRES_PASSWORD: {{ .Values.database.env.POSTGRES_PASSWORD | b64enc | quote }}
  {{- end }}