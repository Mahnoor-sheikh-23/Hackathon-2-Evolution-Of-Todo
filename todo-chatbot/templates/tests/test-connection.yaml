apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "todo-app.fullname" . }}-test-connection"
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['sh', '-c']
      args:
        - |
          echo "Testing connectivity to frontend service..."
          wget -q --timeout=10 {{ include "todo-app.frontend.fullname" . }}:{{ .Values.frontend.service.port }} -O -
          echo "Testing connectivity to backend service..."
          wget -q --timeout=10 {{ include "todo-app.backend.fullname" . }}:{{ .Values.backend.service.port }} -O /dev/null
          echo "Connectivity tests completed successfully!"
  restartPolicy: Never
