{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "todo-app.fullname" . }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- with .Values.httpRoute.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # Route frontend requests to the frontend service
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: {{ include "todo-app.frontend.fullname" . }}
          port: {{ .Values.frontend.service.port }}
          weight: 1
    # Example: Route API requests to the backend service
    # Uncomment and adjust as needed
    # - matches:
    #     - path:
    #         type: PathPrefix
    #         value: "/api"
    #   backendRefs:
    #     - name: {{ include "todo-app.backend.fullname" . }}
    #       port: {{ .Values.backend.service.port }}
    #       weight: 1
{{- end }}
