diploiVersion: v1.0

components:
  # Backend: FastAPI using Docker
  - name: FastAPI Backend
    identifier:  docker
    folder: /backend
    package: https://github.com/diploi/component-python#main
    env:
      include:
        - DATABASE_URL
        - BETTER_AUTH_SECRET
        - OPENAI_API_KEY

  # Frontend: Next.js
  - name: Next.js Frontend
    identifier: next
    folder: /frontend
    package: https://github.com/diploi/component-nextjs#main
    env:
      include:
        - NEXT_PUBLIC_BACKEND_URL
        - NEXT_PUBLIC_BETTER_AUTH_URL

addons:
  # PostgreSQL database
  - name: PostgreSQL
    identifier: postgres
    package: https://github.com/diploi/addon-postgres#main
    env:
      include:
        - POSTGRES_DB
        - POSTGRES_USER
        - POSTGRES_PASSWORD
